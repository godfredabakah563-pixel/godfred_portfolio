<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="expense.css">
  <title>Expense</title>
</head>
<body>
  <main>
    <section>
      <h1>💳MyMoney</h1>
      <p>Personal Expense Tracker.</p>
      <button id="theme-toggle">🌙 Dark Mode</button>
    </section>
    
    <section>
      <fieldset>
        <legend>CURRENT AMOUNT (BALANCE)</legend>
        <p id="balance">GH₵0.00</p>
      </fieldset>
           
    </section>
    
    <section>
     <fieldset>
        <legend>INCOME</legend>
        <p id="income">GH₵0.00</p>
      </fieldset>
      <fieldset>
        <legend>EXPENSE</legend>
        <p id="expense">GH₵0.00</p>
      </fieldset>
    </section>
    
    <section>
      <form id="transaction-form">
        <fieldset>
          <legend>ADD TRANSACTION</legend>
          
          <label for="description">Description(required):</label>
          <input type="text" id="description" name="description" placeholder="e.g., Football boots" required size="20">
          
          <label for="amount">Amount(required):</label>
          <input type="number" id="amount" name="amount" placeholder="e.g., 20" required min="0" step="0.01">
          
          <label for="type">Type(required):</label>
          <select name="type" id="type">
           <div id="option">
             <option value="Income">INCOME</option>
            <option value="expense">EXPENSE</option>
           </div> 
          </select>    

          <button id="btn">+Add Transaction</button>
        </fieldset>
        
          
      </form>
    </section>
    
    <section>
      <fieldset>
        <legend>TRANSACTIONS</legend>
          
      <table id="transaction-table">

  <thead>
    <tr>
      <th>Description</th>
      <th>Amount</th>
      <th>Date</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody id="transaction-list">
  </tbody>

</table>
      </fieldset>
    </section>
  </main>

  <script src="expense.js"></script>
</body>
</html>
